name: Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Pupitre-windows
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml
            dist-electron/beta*.yml
      # The installer is attached to a release of this same repo. The repo has to be public
      # at that moment, otherwise installed copies get a 404 on releases.atom.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml
            dist-electron/beta*.yml
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body: |
            Télécharge Pupitre-Setup, puis ouvre-le depuis le dossier Téléchargements. Il s'installe sans droits administrateur, crée un raccourci sur le Bureau et dans le menu Démarrer, puis se met à jour tout seul.

            Si SmartScreen s'affiche : Informations complémentaires, puis Exécuter quand même (l'exe n'est pas signé).

            Tu avais la version zip ? Installe cette version une fois ; tes sessions, réglages et raccourcis sont repris. Tu peux ensuite supprimer l'ancien dossier extrait.

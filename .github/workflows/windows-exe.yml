name: Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - run: npx electron-builder --win zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Pupitre-windows
          path: dist-electron/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-electron/*.zip
          body: |
            Télécharge le zip. Ne lance pas un .exe depuis la bulle de Chrome : elle reste sur « Opening when complete ».

            1. Ferme la bulle de téléchargement.
            2. Ouvre le dossier Téléchargements et extrais le zip.
            3. Double-clique sur Pupitre.exe qui est dans le dossier extrait.
            4. Si SmartScreen s'affiche : Informations complémentaires, puis Exécuter quand même.

            L'ancien fichier portable (Pupitre.0.1.9.exe) est déjà téléchargé s'il affiche 100/100 Mo. Chrome essaie de l'ouvrir. Ferme cette bulle. Ce zip s'ouvre tout de suite.
